name = "powerjoular"
description = "Monitoring the power consumption of multiple platforms and processes"
version = "2.0.0"

long-description = """
PowerJoular monitors, in real time, the power consumption of hardware components (CPU, GPU), processes and applications, on Windows and Linux.
It follows one process or one whole application, and exports power values to the terminal, to CSV files, and to a shared memory ring buffer.
"""

authors = ["Adel Noureddine"]
maintainers = ["Adel Noureddine <adel.noureddine@outlook.com>"]
maintainers-logins = ["adelnoureddine"]

tags = ["linux", "windows", "power", "energy", "cpu", "gpu", "monitoring"]

licenses = "GPL-3.0-only"
website = "https://www.noureddine.org/research/joular/powerjoular"

executables = ["powerjoular"]

[[depends-on]]
joularcore = "~0.0.1"
cpuload = "~0.0.1"

[gpr-externals]
PJ_OS = ["linux", "windows"]
POWERJOULAR_LINKING = ["default", "full"]

[gpr-set-externals."case(os)".linux]
PJ_OS = "linux"
[gpr-set-externals."case(os)".windows]
PJ_OS = "windows"

[available.'case(os)']
linux = true
windows = true
'...' = false
