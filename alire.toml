name = "powerjoular"
description = "Monitor the power consumption of platforms, processes and applications"
version = "2.0.0"

long-description = """
PowerJoular monitors, in real time, the power consumption of hardware components (CPU, GPU), processes and applications, on Linux, macOS, Windows and FreeBSD.
It follows one process or one whole application, and exports power values to the terminal, to CSV files, and to a shared memory ring buffer.
"""

authors = ["Adel Noureddine"]
maintainers = ["Adel Noureddine <adel.noureddine@outlook.com>"]
maintainers-logins = ["adelnoureddine"]

tags = ["linux", "windows", "macos", "freebsd", "power", "energy", "cpu", "gpu", "monitoring"]

licenses = "GPL-3.0-only"
website = "https://www.noureddine.org/research/joular/powerjoular"

executables = ["powerjoular"]

[[depends-on]]
joularcore = "~0.0.6"
cpuload = "~0.0.6"

[gpr-externals]
POWERJOULAR_LINKING = ["default", "full"]

[available.'case(os)']
linux = true
windows = true
macos = true
freebsd = true
'...' = false
