name: Build

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:

  # GNU/Linux and Raspberry Pi, each built on a runner of its own architecture, so nothing is cross compiled
  #
  # Built in an Ubuntu 22.04 container rather than on the 24.04 runner, so the binary
  # only needs glibc 2.35: Raspberry Pi OS, Debian 12, Ubuntu 22.04 and newer
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
            artifact: powerjoular-linux-amd64

          - name: Raspberry Pi aarch64
            runner: ubuntu-24.04-arm
            artifact: powerjoular-linux-aarch64

    steps:
    - name: Prepare the container
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl unzip git build-essential file

    - name: Checkout
      uses: actions/checkout@v7

    # setup-alire runs from the runner's own path (/home/runner/work), which the container mounts at /__w
    - name: Let the runner's action paths resolve inside the container
      run: |
        mkdir -p /home/runner
        ln -sfn /__w /home/runner/work

    # Alire brings the GNAT toolchain, and fetches the Joular Core and CPU Load libraries
    - name: Set up Alire
      uses: alire-project/setup-alire@v6

    - name: Build
      run: alr --non-interactive build

    - name: Check the binary runs
      run: |
        ./bin/powerjoular -v
        ./bin/powerjoular -h > /dev/null

        # alire.toml and src/powerjoular.ads both carry the version, so check they match
        MANIFEST=$(sed -n 's/^version *= *"\(.*\)"/\1/p' alire.toml | head -1)
        BINARY=$(./bin/powerjoular -v)
        if [ "$MANIFEST" != "$BINARY" ]; then
          echo "alire.toml says $MANIFEST but the binary says $BINARY" >&2
          exit 1
        fi

        # Redirected to a file, the help text must carry no escape sequences
        if ./bin/powerjoular -h | grep -q "$(printf '\033')"; then
          echo "the help text carries escape sequences when redirected" >&2
          exit 1
        fi

    # Read from the binary rather than assumed from the image, so the name stays right if the image changes
    - name: Name the binary after the C library it needs
      id: naming
      run: |
        file bin/powerjoular

        GLIBC=$(objdump -T bin/powerjoular | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
        if [ -z "$GLIBC" ]; then GLIBC=static; fi

        echo "needs glibc $GLIBC or newer"
        mv bin/powerjoular "bin/powerjoular-glibc-$GLIBC"
        echo "glibc=$GLIBC" >> "$GITHUB_OUTPUT"

    - name: Upload the binary
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-glibc-${{ steps.naming.outputs.glibc }}
        path: bin/powerjoular-glibc-${{ steps.naming.outputs.glibc }}
        if-no-files-found: error

  # Built against the glibc 2.34 of Enterprise Linux 9, so it runs on RHEL, AlmaLinux and Rocky 9. x86_64 only
  #
  # GNAT 14.2 and GPRbuild 22 are the newest that run on glibc 2.34: newer ones are built on Ubuntu 22.04 and need 2.35
  # setup-alire is skipped, as it installs the newest toolchain before it can be pinned, so alr is fetched directly
  linux-el9:
    name: AlmaLinux 9 amd64
    runs-on: ubuntu-24.04
    container: almalinux:9

    env:
      ALIRE_VERSION: "2.1.1"
      GNAT_VERSION: "14.2.1"
      GPRBUILD_VERSION: "22.0.1"

    steps:
    # gcc for the linker, start-up files and libc headers (GNAT comes from Alire); --allowerasing swaps curl-minimal for curl
    - name: Prepare the container
      run: |
        dnf install -y --allowerasing gcc git tar unzip findutils binutils ca-certificates curl

    - name: Install Alire
      run: |
        curl -fsSL -o /tmp/alr.zip \
          "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
        unzip -q /tmp/alr.zip -d /opt/alire
        echo "/opt/alire/bin" >> "$GITHUB_PATH"

    - name: Checkout
      uses: actions/checkout@v7

    # The checkout lands owned by another user as far as the container's git is concerned
    - name: Let git work on the checkout
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Pin the toolchain to one this container can run
      run: |
        alr --non-interactive toolchain --select "gnat_native=${GNAT_VERSION}"
        alr --non-interactive toolchain --select "gprbuild=${GPRBUILD_VERSION}"
        alr --non-interactive toolchain

    - name: Build
      run: alr --non-interactive build

    - name: Check the binary runs
      run: |
        ./bin/powerjoular -v
        ./bin/powerjoular -h > /dev/null

        MANIFEST=$(sed -n 's/^version *= *"\(.*\)"/\1/p' alire.toml | head -1)
        BINARY=$(./bin/powerjoular -v)
        if [ "$MANIFEST" != "$BINARY" ]; then
          echo "alire.toml says $MANIFEST but the binary says $BINARY" >&2
          exit 1
        fi

    - name: Name the binary after the C library it needs
      id: naming
      run: |
        file bin/powerjoular || true

        GLIBC=$(objdump -T bin/powerjoular | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
        if [ -z "$GLIBC" ]; then GLIBC=static; fi

        echo "needs glibc $GLIBC or newer"

        # Caught here rather than shipped as a package that cannot start on Enterprise Linux 9
        if [ "$GLIBC" != "static" ] \
           && [ "$(printf '%s\n' "$GLIBC" 2.34 | sort -V | tail -1)" != "2.34" ]; then
          echo "this build needs glibc $GLIBC, newer than the 2.34 of Enterprise Linux 9" >&2
          exit 1
        fi

        mv bin/powerjoular "bin/powerjoular-glibc-$GLIBC"
        echo "glibc=$GLIBC" >> "$GITHUB_OUTPUT"

    - name: Upload the binary
      uses: actions/upload-artifact@v7
      with:
        name: powerjoular-el9-amd64-glibc-${{ steps.naming.outputs.glibc }}
        path: bin/powerjoular-glibc-${{ steps.naming.outputs.glibc }}
        if-no-files-found: error

  # The GNU/Linux packages, built from every binary the Linux jobs produced
  # Packaging only wraps prebuilt files, so this runner's glibc and architecture don't matter
  packages:
    name: Linux packages (deb and rpm)
    needs: [linux, linux-el9]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install the packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends dpkg-dev rpm binutils

    - name: Download the Linux binaries
      uses: actions/download-artifact@v7
      with:
        pattern: powerjoular-*-glibc-*
        path: artifacts

    - name: Build the deb and rpm packages
      run: ./release-version.sh artifacts

    - name: Show what the packages hold
      run: |
        for DEB in packages/*.deb; do
          echo "== $DEB"
          dpkg-deb --info "$DEB" | sed 's/^/    /'
          dpkg-deb --contents "$DEB" | sed 's/^/    /'
        done

        for RPM in packages/*.rpm; do
          echo "== $RPM"
          rpm -qip "$RPM" | sed 's/^/    /'
          rpm -qlp "$RPM" | sed 's/^/    /'
        done

    - name: Upload the packages
      uses: actions/upload-artifact@v7
      with:
        name: powerjoular-linux-packages
        path: packages/*
        if-no-files-found: error

  # macOS, built on a runner of each chip
  # macos-15-intel gives the lowest minimum macOS GitHub still offers for Intel; macos-26-intel is the last Intel image, as macOS 26 is the last macOS for Intel Macs
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            artifact: powerjoular-macos-arm64

          - name: macOS x86_64
            runner: macos-15-intel
            artifact: powerjoular-macos-x86_64

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # Alire picks PJ_OS=macos on its own
    - name: Set up Alire
      uses: alire-project/setup-alire@v6

    - name: Build
      run: alr --non-interactive build

    # powermetrics reports nothing on VM runners, even as root, so only the version and the help are checked
    - name: Check the binary runs
      run: |
        ./bin/powerjoular -v
        ./bin/powerjoular -h > /dev/null

        MANIFEST=$(sed -n 's/^version *= *"\(.*\)"/\1/p' alire.toml | head -1)
        BINARY=$(./bin/powerjoular -v)
        if [ "$MANIFEST" != "$BINARY" ]; then
          echo "alire.toml says $MANIFEST but the binary says $BINARY" >&2
          exit 1
        fi

        if ./bin/powerjoular -h | grep -q "$(printf '\033')"; then
          echo "the help text carries escape sequences when redirected" >&2
          exit 1
        fi

    - name: Show what the binary asks of the system
      run: |
        file bin/powerjoular
        otool -L bin/powerjoular
        vtool -show-build bin/powerjoular

    - name: Upload the binary
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: bin/powerjoular
        if-no-files-found: error

  # Windows, 64 bits
  windows:
    name: Windows amd64
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Alire
      uses: alire-project/setup-alire@v6

    - name: Build
      run: alr --non-interactive build

    - name: Check the binary runs
      shell: bash
      run: |
        ./bin/powerjoular.exe -v
        ./bin/powerjoular.exe -h > /dev/null

        MANIFEST=$(sed -n 's/^version *= *"\(.*\)"/\1/p' alire.toml | head -1)
        BINARY=$(./bin/powerjoular.exe -v | tr -d '\r')
        if [ "$MANIFEST" != "$BINARY" ]; then
          echo "alire.toml says $MANIFEST but the binary says $BINARY" >&2
          exit 1
        fi

    - name: Upload the binary
      uses: actions/upload-artifact@v7
      with:
        name: powerjoular-windows-amd64
        path: bin/powerjoular.exe
        if-no-files-found: error

  # FreeBSD, built inside a virtual machine as GitHub has no FreeBSD runners. amd64 only, as RAPL is x86 only
  #
  # Alire's index has no CPU Load and Joular Core with FreeBSD support yet, so their develop branches are checked out and built with GPRBuild
  # PJ_OS and PJ_X86 are given, so a target GPRBuild does not recognise cannot turn this into a Linux or a non-x86 build
  # The virtual machine has no RAPL, so only the version and the help are checked
  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Checkout CPU Load
      uses: actions/checkout@v7
      with:
        repository: joular/cpuload
        ref: develop
        path: deps/cpuload

    - name: Checkout Joular Core
      uses: actions/checkout@v7
      with:
        repository: joular/joularcore
        ref: develop
        path: deps/joularcore

    # The newest FreeBSD 14, so the binary also runs on FreeBSD 15
    # gprbuild brings GNAT 12, the default Ada compiler of FreeBSD
    - name: Build and check in FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "14"
        prepare: pkg install -y gprbuild
        run: |
          export PATH=/usr/local/gnat12/bin:$PATH
          gprbuild -P powerjoular.gpr -aPdeps/joularcore -aPdeps/cpuload -XPJ_OS=freebsd -XPJ_X86=True -p

          ./bin/powerjoular -v
          ./bin/powerjoular -h > /dev/null

          MANIFEST=$(sed -n 's/^version *= *"\(.*\)"/\1/p' alire.toml | head -1)
          BINARY=$(./bin/powerjoular -v)
          if [ "$MANIFEST" != "$BINARY" ]; then
            echo "alire.toml says $MANIFEST but the binary says $BINARY" >&2
            exit 1
          fi

          if ./bin/powerjoular -h | grep -q "$(printf '\033')"; then
            echo "the help text carries escape sequences when redirected" >&2
            exit 1
          fi

          # Only libraries of the base system, so it runs where GNAT is not installed
          file bin/powerjoular
          ldd bin/powerjoular
          if ldd bin/powerjoular | grep -q /usr/local/; then
            echo "the binary needs a library installed with GNAT" >&2
            exit 1
          fi

    - name: Upload the binary
      uses: actions/upload-artifact@v7
      with:
        name: powerjoular-freebsd-amd64
        path: bin/powerjoular
        if-no-files-found: error
